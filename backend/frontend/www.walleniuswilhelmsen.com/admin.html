<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shipment Admin Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f5f7fa;
      color: #333;
      padding: 30px;
    }

    h1 {
      color: #003366;
      margin-bottom: 20px;
    }

    /* Card */
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    .card h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: #003366;
    }

    /* Form */
    form input, form select, form button {
      padding: 10px;
      margin: 8px 6px 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    form button {
      background: #003366;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    form button:hover {
      background: #0055aa;
    }

    /* Group headings */
    .status-group {
      margin-bottom: 30px;
    }
    .status-group h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #0055aa;
      border-left: 4px solid #0055aa;
      padding-left: 8px;
    }

    /* Shipment Cards Layout */
    .shipments-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .shipment-card {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .shipment-card h4 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #003366;
    }

    .shipment-detail {
      font-size: 0.9rem;
      margin: 4px 0;
    }

    .shipment-detail strong {
      color: #003366;
    }

    .status-select, .location, .remarks, .etd, .eta, .description {
      padding: 6px;
      margin-top: 6px;
      width: 100%;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* Buttons */
    .action-buttons {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .action-btn {
      min-width: 80px;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.3s ease;
    }
    .update-btn {
      background: #28a745;
      color: #fff;
    }
    .update-btn:hover {
      background: #218838;
    }
    .delete-btn {
      background: #dc3545;
      color: #fff;
    }
    .delete-btn:hover {
      background: #c82333;
    }

    /* Status action buttons (quick status controls) */
    .status-action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .status-action-btn {
      padding: 6px 8px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .status-action-btn.picked { background:#fff7ed; color:#7a4a00; border:1px solid rgba(0,0,0,0.06); }
    .status-action-btn.intransit { background:#ecfeff; color:#055e6c; border:1px solid rgba(0,0,0,0.06); }
    .status-action-btn.outfordelivery { background:#fff1f0; color:#7a1a1a; border:1px solid rgba(0,0,0,0.06); }
    .status-action-btn.delivered { background:#ecfdf5; color:#065f46; border:1px solid rgba(0,0,0,0.06); }

    .status-label {
      display:inline-block;
      padding:4px 8px;
      border-radius:12px;
      font-weight:600;
      background:#f0f7ff;
      color:#003366;
      font-size:0.85rem;
      margin-left:6px;
    }

    /* Search & Filter */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-bar input, .filter-bar select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Shipment Admin Dashboard</h1>

  <!-- Booking Form -->
  <div class="card">
    <h2>Add Booking</h2>
    <form id="bookingForm">
      <input type="text" name="senderName" placeholder="Sender Name" required>
      <input type="text" name="senderContact" placeholder="Sender Contact">
      <input type="text" name="consigneeName" placeholder="Consignee Name" required>
      <input type="text" name="consigneeContact" placeholder="Consignee Contact">
      <input type="text" name="origin" placeholder="Origin" required>
      <input type="text" name="destination" placeholder="Destination" required>
      <input type="text" name="cargo" placeholder="Cargo Description" required>
      <input type="text" name="packageDescription" placeholder="Package Details">
      <input type="text" name="weight" placeholder="Weight (kg)" required>
      <input type="text" name="dimensions" placeholder="Dimensions (LxWxH cm)" required>
      <input type="number" name="quantity" placeholder="Quantity" required>
      <input type="text" name="estimatedDeparture" placeholder="Estimated Departure (e.g. 2025-08-21)">
      <input type="text" name="estimatedDelivery" placeholder="Estimated Delivery (e.g. 2025-08-28)">
      <button type="submit">Add Booking</button>
    </form>
  </div>

  <!-- Shipments -->
  <div class="card">
    <h2>All Shipments</h2>

    <div class="filter-bar">
      <input type="text" id="searchBox" placeholder="Search by Tracking #, Sender, Consignee, Cargo">
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option>Booked</option>
        <option>Picked Up</option>
        <option>In Transit</option>
        <option>Out for Delivery</option>
        <option>Delivered</option>
      </select>
    </div>

    <div id="shipmentsWrapper"></div>
  </div>

  <script>
    const API_BASE = '';

    let allShipments = [];

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {
        senderName: form.senderName.value,
        senderContact: form.senderContact.value,
        consigneeName: form.consigneeName.value,
        consigneeContact: form.consigneeContact.value,
        origin: form.origin.value,
        destination: form.destination.value,
        cargo: form.cargo.value,
        packageDescription: form.packageDescription.value,
        weight: parseFloat(form.weight.value) || 0,
        dimensions: form.dimensions.value,
        quantity: parseInt(form.quantity.value) || 0,
        estimatedDeparture: form.estimatedDeparture.value,
        estimatedDelivery: form.estimatedDelivery.value
      };
      try {
        const res = await fetch(API_BASE + '/admin/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if(result.ok) {
          alert('Booking added: ' + result.shipment.trackingNumber);
          loadShipments();
          form.reset();
        } else {
          alert('Error: ' + (result.error || 'unknown'));
        }
      } catch (err) {
        console.error('Booking error', err);
        alert('Error adding booking');
      }
    });

    function createCard(s) {
      const sender = s.senderContact ? `${s.senderName} (${s.senderContact})` : s.senderName;
      const consignee = s.consigneeContact ? `${s.consigneeName} (${s.consigneeContact})` : s.consigneeName;

      const card = document.createElement('div');
      card.className = 'shipment-card';
      card.innerHTML = `
        <h4>Tracking #: ${s.trackingNumber}</h4>
        <div class="shipment-detail"><strong>Sender:</strong> ${sender || ''}</div>
        <div class="shipment-detail"><strong>Consignee:</strong> ${consignee || ''}</div>
        <div class="shipment-detail"><strong>Origin:</strong> ${s.origin || ''} → <strong>Destination:</strong> ${s.destination || ''}</div>
        <div class="shipment-detail"><strong>Cargo:</strong> ${s.cargo || ''}</div>
        <div class="shipment-detail"><strong>Description:</strong> ${s.packageDescription || ''}</div>
        <div class="shipment-detail"><strong>Weight:</strong> ${s.weight || ''} kg</div>
        <div class="shipment-detail"><strong>Dimensions:</strong> ${s.dimensions || ''}</div>
        <div class="shipment-detail"><strong>Quantity:</strong> ${s.quantity || ''}</div>

        <div class="shipment-detail"><strong>ETD:</strong> <input type="text" value="${s.estimatedDeparture||''}" class="etd"></div>
        <div class="shipment-detail"><strong>ETA:</strong> <input type="text" value="${s.estimatedDelivery||''}" class="eta"></div>

        <div class="shipment-detail"><strong>Status:</strong> <span class="status-label">${s.status || ''}</span></div>

        <div class="status-action-buttons">
          <button class="status-action-btn picked">Picked Up</button>
          <button class="status-action-btn intransit">In Transit</button>
          <button class="status-action-btn outfordelivery">Out for Delivery</button>
          <button class="status-action-btn delivered">Delivered</button>
        </div>

        <div class="action-buttons">
          <button class="action-btn update-btn">Update</button>
          <button class="action-btn delete-btn">Delete</button>
        </div>
      `;

      const statusLabel = card.querySelector('.status-label');

      // Helper to call update endpoint
      async function doUpdate(payload) {
        try {
          const res = await fetch(API_BASE + '/admin/update/' + s.trackingNumber, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if(result.ok) {
            statusLabel.textContent = result.shipment?.status || payload.status || statusLabel.textContent;
            loadShipments();
            return true;
          } else {
            alert('Error: ' + (result.error || 'update failed'));
            return false;
          }
        } catch (err) {
          console.error('Update error', err);
          alert('Error updating shipment');
          return false;
        }
      }

      // Status action buttons (fixed with .onclick to prevent duplicate bindings)
      card.querySelector('.status-action-btn.picked').onclick = () => {
        doUpdate({ status: 'Picked Up' });
      };
      card.querySelector('.status-action-btn.intransit').onclick = () => {
        doUpdate({ status: 'In Transit' });
      };
      card.querySelector('.status-action-btn.outfordelivery').onclick = () => {
        doUpdate({ status: 'Out for Delivery' });
      };
      card.querySelector('.status-action-btn.delivered').onclick = () => {
        doUpdate({ status: 'Delivered' });
      };

      // Update handler (for location, remarks, ETD/ETA)
      card.querySelector('.update-btn').onclick = async () => {
        const currentStatus = statusLabel.textContent || s.status;
        const estimatedDeparture = card.querySelector('.etd').value;
        const estimatedDelivery = card.querySelector('.eta').value;

        await doUpdate({ status: currentStatus, location, remarks, estimatedDeparture, estimatedDelivery });
      };

      // Delete handler
      card.querySelector('.delete-btn').onclick = async () => {
        if(confirm('Delete shipment ' + s.trackingNumber + '?')) {
          try {
            const res = await fetch(API_BASE + '/admin/delete/' + s.trackingNumber, { method: 'DELETE' });
            const result = await res.json();
            if(result.ok) {
              alert('Deleted ' + s.trackingNumber);
              loadShipments();
            } else {
              alert('Error: ' + (result.error || 'delete failed'));
            }
          } catch (err) {
            console.error('Delete error', err);
            alert('Error deleting shipment');
          }
        }
      };

      return card;
    }

    function renderShipments(shipments) {
      const wrapper = document.getElementById('shipmentsWrapper');
      wrapper.innerHTML = '';

      // Desired ordering of statuses
      const orderedStatuses = ["Booked", "Picked Up", "In Transit", "Out for Delivery", "Delivered"];

      // Include any extra statuses that exist in data
      const extras = [...new Set(shipments.map(s => s.status).filter(st => st && !orderedStatuses.includes(st)))];
      const statuses = orderedStatuses.concat(extras);

      statuses.forEach(status => {
        const group = shipments.filter(s => s.status === status);
        if(group.length > 0) {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'status-group';
          groupDiv.innerHTML = `<h3>${status}</h3>`;

          const container = document.createElement('div');
          container.className = 'shipments-container';

          group.forEach(s => container.appendChild(createCard(s)));

          groupDiv.appendChild(container);
          wrapper.appendChild(groupDiv);
        }
      });
    }

    async function loadShipments() {
      try {
        const res = await fetch(API_BASE + '/admin/list');
        const data = await res.json();
        allShipments = Array.isArray(data) ? data : (data.list || []);
        applyFilters();
      } catch (err) {
        console.error('Load shipments error', err);
      }
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchBox').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      let filtered = allShipments.filter(s => {
        const tn = (s.trackingNumber || '').toString().toLowerCase();
        const matchesSearch =
          tn.includes(searchTerm) ||
          (s.senderName || '').toLowerCase().includes(searchTerm) ||
          (s.consigneeName || '').toLowerCase().includes(searchTerm) ||
          (s.cargo || '').toLowerCase().includes(searchTerm);

        const matchesStatus = statusFilter ? s.status === statusFilter : true;
        return matchesSearch && matchesStatus;
      });

      renderShipments(filtered);
    }

    document.getElementById('searchBox').addEventListener('input', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);

    loadShipments();
  </script>
</body>
</html>
